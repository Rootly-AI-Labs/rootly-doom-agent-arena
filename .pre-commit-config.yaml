repos:
  - repo: local
    hooks:
      - id: ruff
        name: Ruff
        entry: uv run --locked ruff check
        language: system
        types: [python]
      - id: ty
        name: ty
        entry: uv run --locked --group maps ty check
        language: system
        types: [python]
        pass_filenames: false
      - id: yamllint
        name: YAML lint
        entry: uv run --locked yamllint
        language: system
        types: [yaml]
        exclude: ^website/pnpm-lock.yaml$
      - id: actionlint
        name: GitHub Actions lint
        entry: uv run --locked actionlint
        language: system
        files: ^.github/workflows/.*\.ya?ml$
        pass_filenames: false
      - id: shellcheck
        name: ShellCheck
        entry: uv run --locked shellcheck
        language: system
        files: ^scripts/.*\.sh$
      - id: website
        name: Website lint, formatting, and types
        entry: pnpm --dir website check
        language: system
        files: ^website/
        pass_filenames: false
