version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    open-pull-requests-limit: 10
  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    groups:
      website-compatible:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 10
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-compatible:
        patterns: ['*']
        update-types: [minor, patch]
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
