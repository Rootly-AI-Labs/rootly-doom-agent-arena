name: Website — GitHub Pages

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-pages.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website-pages.yml']
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_BASE_PATH: /rootly-doom-agent-arena
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: website/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint, format, and type check
        run: pnpm check
      - name: Export static website
        run: pnpm build
      - name: Verify export and asset paths
        run: pnpm verify:export
      # Package directly: upload-pages-artifact has an unpinned nested action.
      - name: Package GitHub Pages artifact
        run: |
          tar --dereference --hard-dereference \
            --directory out \
            --exclude=.git --exclude=.github \
            -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    timeout-minutes: 10
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
