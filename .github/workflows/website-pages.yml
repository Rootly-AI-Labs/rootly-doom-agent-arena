name: Website — GitHub Pages

on:
  push:
    branches: [main]
    paths: ['website/**', '.github/workflows/website-pages.yml']
  pull_request:
    paths: ['website/**', '.github/workflows/website-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    env:
      NEXT_PUBLIC_BASE_PATH: /rootly-doom-agent-arena
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: npx --yes pnpm@12.3.4 install --frozen-lockfile
      - name: Type check
        run: npx --yes pnpm@12.3.4 exec tsc --noEmit
      - name: Export static website
        run: npx --yes pnpm@12.3.4 build
      - name: Verify export and asset paths
        run: node scripts/verify-export.mjs
      # Package directly: upload-pages-artifact has an unpinned nested action.
      - name: Package GitHub Pages artifact
        run: |
          tar --dereference --hard-dereference \
            --directory out \
            --exclude=.git --exclude=.github \
            -cf "$RUNNER_TEMP/artifact.tar" .
      - name: Upload GitHub Pages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
