name: Tests

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python and repository quality
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          enable-cache: true
      - run: uv sync --locked --group maps
      - name: Lint Python
        run: uv run --locked ruff check .
      - name: Type check Python
        run: uv run --locked --group maps ty check
      - name: Lint YAML, workflows, and shell scripts
        run: |
          uv run --locked yamllint .
          uv run --locked actionlint
          uv run --locked zizmor --offline .github/workflows
          uv run --locked shellcheck scripts/*.sh

  test:
    name: Python ${{ matrix.python }} tests and C smoke tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14', '3.15']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - name: Run arena and agent plugin tests
        run: uv run --locked pytest -v --tb=short --junitxml=junit.xml
      - name: Compile and test C intent parser and autopilot
        run: |
          uv run --locked python scripts/smoke_participant_intents_parser.py
          uv run --locked python scripts/smoke_participant_autopilot.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-python-${{ matrix.python }}
          path: junit.xml
          retention-days: 7

  browser-syntax:
    name: Browser JavaScript syntax
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: website/.node-version
          package-manager-cache: false
      - name: Validate browser JavaScript syntax
        run: |
          node --check src/websockets-doom.js
          node --check src/elevenagents-commentator.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('src/index.html','utf8'); const script=html.split('<script>').at(-1).split('</script>',1)[0]; new Function(script);"

  docker:
    name: Docker runtime smoke test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
      - name: Set up cached Blacksmith Docker builder
        uses: useblacksmith/setup-docker-builder@06dd9c83a5d541274d2e3ac67625560979275267 # v2
        with:
          cache-key: docker/Dockerfile
      - name: Build and verify Docker server and MCP
        run: uv run --locked python scripts/smoke_docker_setup.py
      - name: Stop smoke test containers
        if: always()
        run: docker compose -f docker/docker-compose.yml down
