name: Tests

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest tests/ -v --tb=short

      - name: Validate browser JavaScript syntax
        run: |
          node --check src/websockets-doom.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('src/index.html','utf8'); const script=html.split('<script>').at(-1).split('</script>',1)[0]; new Function(script);"
